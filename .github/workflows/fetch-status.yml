name: Fetch Metro Status

on:
  repository_dispatch:
    types: [fetch-status]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4
          playwright install chromium --with-deps

      - name: Run Barcelona scraper
        run: python scripts/fetch_status.py

      - name: Run Madrid scraper
        run: python scripts/fetch_status_madrid.py

      - name: Run Valencia scraper
        run: python scripts/fetch_status_valencia.py

      - name: Run Sevilla scraper
        run: python scripts/fetch_status_sevilla.py

      - name: Run Bilbao scraper
        run: python scripts/fetch_status_bilbao.py

      - name: Run Segunda División scraper
        run: python scripts/fetch_status_segunda.py

      - name: Commit updated status files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/status.json data/madrid_status.json data/valencia_status.json data/sevilla_status.json data/bilbao_status.json data/segunda_status.json
          git diff --staged --quiet || git commit -m "chore: update metro status [skip ci]"
          git pull --rebase origin main
          git push
